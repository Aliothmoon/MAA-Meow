name: Bug 反馈（中文）
description: 使用中文提交可复现的 Bug 报告
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提交 Bug 反馈！请尽量详细地填写以下信息，以帮助我们快速定位和修复问题。

        ## 标题

        标题只需写清**具体故障现象**，提交后会按下方「功能模块」自动补成 `[Bug][模块] 具体故障现象`。

        - 推荐：`启动任务后应用闪退`、`Boss 战结束后任务直接停止`
        - 不推荐：`有问题`、`无法使用`、`求助`

        完整规则与模块说明见 [Issue 规范](https://github.com/Aliothmoon/MAA-Meow/blob/main/docs/zh-cn/develop/ISSUE_GUIDELINES.md)。

  # label 与选项被 .github/workflows/issue-title.yml 用来补标题，改动需同步
  - type: dropdown
    id: module
    attributes:
      label: 功能模块
      description: "选最先出现异常的位置：任务执行出错选对应任务；首页、设置、悬浮窗等界面问题选「界面与设置」"
      options:
        - 开始唤醒
        - 理智作战
        - 自动公招
        - 基建换班
        - 信用收支
        - 领取奖励
        - 自动肉鸽
        - 生息演算
        - 其他长草任务
        - 自动战斗
        - 小工具
        - 定时任务
        - 前台模式
        - 后台模式
        - 权限与服务连接
        - 通知
        - 安装与更新
        - 界面与设置
        - 其他
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android 版本
      description: "设备的 Android 系统版本，可附 ROM 版本"
      placeholder: "Android 14 / HyperOS 2"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: 设备型号
      description: "设备品牌和型号"
      placeholder: "小米 14 / Samsung Galaxy S24"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: 权限方案
      description: "设置 → 运行环境 → 启动模式"
      options:
        - Shizuku
        - Root
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      description: "出现问题时使用的运行模式"
      options:
        - 前台模式（悬浮窗）
        - 后台模式（虚拟显示器）
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: "补充标题未能说明的触发条件、实际结果和影响；不要只重复标题"
      placeholder: "在什么情况下执行了什么操作，实际发生了什么，以及问题造成了什么影响"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: "请详细描述如何复现此问题"
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: "描述您期望的正确行为"
    validations:
      required: false

  - type: textarea
    id: log-file
    attributes:
      label: 日志文件
      description: |
        请按以下步骤导出日志：
        1. 在 App 设置中打开 **Debug 模式**
        2. 复现问题操作
        3. 导出日志压缩包并上传至此处

        > 日志对定位问题至关重要，**请务必上传**。
      placeholder: "将日志 .zip 文件拖拽到此处上传"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: "如有相关截图或录屏，可上传至此处"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: "其他可能有助于排查问题的信息"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，确认没有重复提交
          required: true
        - label: 我已上传在 Debug 模式下复现后导出的日志文件
          required: true
