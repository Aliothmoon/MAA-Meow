name: Bug 反馈（中文）
description: 使用中文提交可复现的 Bug 报告
title: "[Bug][模块] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您提交 Bug 反馈！请尽量详细地填写以下信息，以帮助我们快速定位和修复问题。

        ## 标题格式

        请先将页面顶部的标题改为：`[Bug][实际模块] 具体故障现象`

        - 将 `[模块]` 替换为实际模块，例如 `[后台模式]`、`[定时任务]` 或 `[自动战斗]`
        - “具体故障现象”应说明发生了什么；仅查看标题时，也应该能判断问题范围
        - 推荐：`[Bug][后台模式] 启动任务后应用闪退`
        - 不推荐：`[Bug] 有问题`、`[Bug][模块] 无法使用`

        完整规则与更多示例见 [Issue 规范](/Aliothmoon/MAA-Meow/blob/main/docs/zh-cn/develop/ISSUE_GUIDELINES.md)。

  - type: dropdown
    id: module
    attributes:
      label: 功能模块
      description: "请选择最接近问题发生位置的模块，并将同一模块填写到标题中"
      options:
        - 首页
        - 任务配置
        - 前台模式
        - 后台模式
        - 定时任务
        - 自动战斗
        - 工具箱
        - 设置
        - 安装更新
        - 构建
        - 文档
        - 其他
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android 版本
      description: "设备的 Android 系统版本（如 Android 14 / API 34）"
      placeholder: "Android 14"
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: 设备型号
      description: "设备品牌和型号"
      placeholder: "小米 14 / Samsung Galaxy S24"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: MAA Meow 版本
      description: "当前使用的 App 版本号"
      placeholder: "v0.1.1"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      description: "出现问题时使用的运行模式"
      options:
        - 前台模式（悬浮窗）
        - 后台模式（虚拟显示器）
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: "补充标题未能说明的触发条件、实际结果和影响；不要只重复标题"
      placeholder: "在什么情况下执行了什么操作，实际发生了什么，以及问题造成了什么影响"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: "请详细描述如何复现此问题"
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: "描述您期望的正确行为"
    validations:
      required: false

  - type: textarea
    id: log-file
    attributes:
      label: 日志文件
      description: |
        请按以下步骤导出日志：
        1. 在 App 设置中打开 **Debug 模式**
        2. 复现问题操作
        3. 导出日志压缩包并上传至此处

        > 日志对定位问题至关重要，**请务必上传**。
      placeholder: "将日志 .zip 文件拖拽到此处上传"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏
      description: "如有相关截图或录屏，可上传至此处"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: "其他可能有助于排查问题的信息"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已将标题改为 `[Bug][实际模块] 具体故障现象`，仅查看标题即可判断问题范围
          required: true
        - label: 我未仔细阅读这些内容，只是一键已读[所有内容](https://github.com/Aliothmoon/MAA-Meow/issues)，并相信这不会影响问题的处理
          required: false
        - label: 我已搜索过现有 Issue，确认没有重复提交
          required: true
        - label: 我已上传在 Debug 模式下复现后导出的日志文件
          required: true
