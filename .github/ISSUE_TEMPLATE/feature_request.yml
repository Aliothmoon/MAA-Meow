name: 功能建议（中文）
description: 使用中文建议新增功能或改进现有体验
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您为 MAA Meow 提出建议！为了便于判断需求价值和范围，请填写具体使用场景，而不只是功能名称。

        ## 标题

        标题只需写清**具体需求**，提交后会按下方「功能模块」自动补成 `[Feature][模块] 具体需求`。

        - 推荐：`支持按干员职业筛选作业`、`任务完成通知附带结算截图`
        - 不推荐：`建议优化`、`加个功能`

        完整规则与模块说明见 [Issue 规范](https://github.com/Aliothmoon/MAA-Meow/blob/main/docs/zh-cn/develop/ISSUE_GUIDELINES.md)。

  - type: dropdown
    id: request-type
    attributes:
      label: 建议类型
      description: "请选择最接近的建议类型"
      options:
        - 新功能
        - 现有功能改进
        - 交互 / 体验优化
        - 性能优化
        - 其他
    validations:
      required: true

  # label 与选项被 .github/workflows/issue-title.yml 用来补标题，改动需同步
  - type: dropdown
    id: module
    attributes:
      label: 功能模块
      description: "选建议主要涉及的模块：针对某个任务的选对应任务；首页、设置、悬浮窗等界面相关的选「界面与设置」"
      options:
        - 开始唤醒
        - 理智作战
        - 自动公招
        - 基建换班
        - 信用收支
        - 领取奖励
        - 自动肉鸽
        - 生息演算
        - 其他长草任务
        - 自动战斗
        - 小工具
        - 定时任务
        - 前台模式
        - 后台模式
        - 权限与服务连接
        - 通知
        - 安装与更新
        - 界面与设置
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与现有问题
      description: "说明在什么场景下遇到了什么困难，以及现有方式为什么不足"
      placeholder: "当……时，我需要……；目前只能……，这会导致……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: "描述期望的行为或交互；如涉及界面，可附草图或参考截图"
      placeholder: "建议在……增加……；用户执行……后，应用应……"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完成标准
      description: "选填：怎样算实现了这个建议"
      placeholder: |
        - 可以……
        - 完成……后会……
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: "说明尝试过的替代方法、临时解决方式，或为什么这些方案不合适"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: "可附相关 Issue、产品参考、截图、录屏或其他上下文"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，确认没有重复建议
          required: true
        - label: 此 Issue 只包含一个主要建议，没有混入互不相关的需求
          required: true
